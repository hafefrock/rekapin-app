name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - name: Run unit tests
        id: unit-tests
        run: gradle testDebugUnitTest --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - name: Run Android instrumentation tests
        id: instrumentation-tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-instrumentation-tests.sh
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rekapin-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: rekapin-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
