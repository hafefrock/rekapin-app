name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
      - name: Run unit tests
        id: unit-tests
        run: gradle testDebugUnitTest --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
        continue-on-error: true
      - name: Run Android instrumentation tests
        id: instrumentation-tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            for attempt in 1 2 3 4 5; do
              if adb shell settings put global package_verifier_enable 0 && adb shell settings put global verifier_verify_adb_installs 0; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              adb wait-for-device || true
              sleep 5
            done
            gradle connectedDebugAndroidTest --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
        continue-on-error: true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rekapin-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rekapin-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
      - name: Mark workflow failed if any test suite failed
        if: steps.unit-tests.outcome == 'failure' || steps.instrumentation-tests.outcome == 'failure'
        run: exit 1
