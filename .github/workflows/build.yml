name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - name: Run unit tests
        id: unit-tests
        run: gradle testDebugUnitTest --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        id: instrumentation-tests
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-instrumentation-tests.sh
      - name: Configure release signing
        id: release-signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rekapin-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/rekapin-release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. Only a debug APK will be built."
          fi
      - name: Build signed release APK
        if: steps.release-signing.outputs.available == 'true'
        run: gradle assembleRelease --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - name: Build debug APK
        if: steps.release-signing.outputs.available != 'true'
        run: gradle assembleDebug --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.release-signing.outputs.available == 'true' && 'rekapin-release-apk' || 'rekapin-debug-apk' }}
          path: ${{ steps.release-signing.outputs.available == 'true' && 'app/build/outputs/apk/release/*.apk' || 'app/build/outputs/apk/debug/*.apk' }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: rekapin-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
      - name: Publish APK as GitHub pre-release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rekapin-build-${{ github.run_number }}
          name: Rekapin test build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
