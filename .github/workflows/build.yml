name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rekapin-apk
          path: app/build/outputs/apk/debug/*.apk
