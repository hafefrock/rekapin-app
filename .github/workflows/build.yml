name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        id: instrumentation-tests
        continue-on-error: true
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-instrumentation-tests.sh
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - name: Check release signing secrets
        id: check-release-secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Secret rilis (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) belum diisi; hanya build debug APK."
          fi
      - name: Prepare release keystore
        if: steps.check-release-secrets.outputs.has_release_secrets == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
      - name: Build release APK
        if: steps.check-release-secrets.outputs.has_release_secrets == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rekapin-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: steps.check-release-secrets.outputs.has_release_secrets == 'true'
        continue-on-error: true
        with:
          name: rekapin-release-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: rekapin-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
      - name: Publish Release APK to GitHub Releases
        if: success() && github.ref == 'refs/heads/main' && steps.check-release-secrets.outputs.has_release_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rekapin-release-${{ github.run_number }}
          name: Rekapin Release ${{ github.run_number }}
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
      - name: Publish Debug APK as GitHub pre-release
        if: success() && github.ref == 'refs/heads/main' && steps.check-release-secrets.outputs.has_release_secrets != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rekapin-build-${{ github.run_number }}
          name: Rekapin test build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
