name: Build and Test APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rekapin-main-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - name: Run unit tests
        id: unit-tests
        run: |
          for attempt in 1 2 3; do
            echo "Unit test attempt $attempt/3"
            if gradle testDebugUnitTest --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Unit tests failed; retrying in 20 seconds to tolerate transient Maven/Robolectric download failures."
              sleep 20
            fi
          done
          exit 1
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        id: instrumentation-tests
        timeout-minutes: 25
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-instrumentation-tests.sh
      - name: Build debug APK for internal testing
        run: gradle assembleDebug --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rekapin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish GitHub pre-release (debug APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Rekapin Beta ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rekapin-test-results
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
          if-no-files-found: ignore
