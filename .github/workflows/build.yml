name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 9.3.1}
      - run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
      - name: Run unit tests
        id: unit-tests
        run: gradle testDebugUnitTest --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
        continue-on-error: true
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --no-parallel -Pkotlin.compiler.execution.strategy=daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rekapin-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rekapin-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - name: Mark workflow failed if unit tests failed
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1
